[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gclassfetch"
version = "1.0.0"
description = "A clean and fast downloader for Google Classroom courses, lecture notes, and assignments."
readme = "README.md"
authors = [{ name = "Malhar Jani" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0"
]

[project.scripts]
gclassfetch = "app:main"

[project.urls]
Homepage = "https://github.com/Malhar-Jani/gclassfetch"
Repository = "https://github.com/Malhar-Jani/gclassfetch"
